name: Holoo Isolated Restore and Inventory

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoHoloo1_030223_11-08-27_S700963.Zip'
      - '.github/workflows/holoo-restore-inventory.yml'

permissions:
  contents: read

jobs:
  restore-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Extract backup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('AutoHoloo1_030223_11-08-27_S700963.Zip')
          entries=[e for e in z.infolist() if not e.is_dir()]
          if len(entries)!=1: raise SystemExit(f'Expected one payload, found {len(entries)}')
          with z.open(entries[0]) as src, open('/tmp/holoo_backup.bak','wb') as dst:
              while b:=src.read(1024*1024): dst.write(b)
          PY
          mkdir -p reports

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="Knd$(openssl rand -hex 18)aA9!"
          echo "$SA_PASSWORD" > /tmp/sql_sa_password
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name holoo-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SA_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          docker logs holoo-sql
          exit 1

      - name: Verify and restore backup into isolated database
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="$(cat /tmp/sql_sa_password)"
          docker exec holoo-sql mkdir -p /var/opt/mssql/backup
          docker cp /tmp/holoo_backup.bak holoo-sql:/var/opt/mssql/backup/holoo_backup.bak
          SQLCMD=(docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b)
          "${SQLCMD[@]}" -Q "RESTORE VERIFYONLY FROM DISK=N'/var/opt/mssql/backup/holoo_backup.bak';"
          "${SQLCMD[@]}" -Q "RESTORE DATABASE [HolooAnalysis] FROM DISK=N'/var/opt/mssql/backup/holoo_backup.bak' WITH MOVE N'Holoo_Data' TO N'/var/opt/mssql/data/HolooAnalysis.mdf', MOVE N'Holoo_Log' TO N'/var/opt/mssql/data/HolooAnalysis_log.ldf', RECOVERY, STATS=5;"
          "${SQLCMD[@]}" -Q "DBCC CHECKDB([HolooAnalysis]) WITH NO_INFOMSGS, ALL_ERRORMSGS;" -o /tmp/dbcc_checkdb.txt
          docker cp holoo-sql:/tmp/dbcc_checkdb.txt reports/dbcc_checkdb.txt
          "${SQLCMD[@]}" -W -s "|" -Q "SELECT name, compatibility_level, collation_name, state_desc, recovery_model_desc FROM sys.databases WHERE name=N'HolooAnalysis';" -o /tmp/database_info.txt
          docker cp holoo-sql:/tmp/database_info.txt reports/database_info.txt

      - name: Inventory database objects and row counts
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="$(cat /tmp/sql_sa_password)"
          SQLCMD=(docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -d HolooAnalysis -b -W -s "|")
          "${SQLCMD[@]}" -Q "SELECT s.name AS schema_name,t.name AS table_name,SUM(p.rows) AS row_count FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id LEFT JOIN sys.partitions p ON p.object_id=t.object_id AND p.index_id IN (0,1) GROUP BY s.name,t.name ORDER BY s.name,t.name;" -o /tmp/table_inventory.txt
          docker cp holoo-sql:/tmp/table_inventory.txt reports/table_inventory.txt
          "${SQLCMD[@]}" -Q "SELECT s.name AS schema_name,o.name AS object_name,o.type_desc FROM sys.objects o JOIN sys.schemas s ON s.schema_id=o.schema_id WHERE o.type IN ('V','P','FN','IF','TF','TR') ORDER BY o.type_desc,s.name,o.name;" -o /tmp/programmable_objects.txt
          docker cp holoo-sql:/tmp/programmable_objects.txt reports/programmable_objects.txt
          "${SQLCMD[@]}" -Q "SELECT s.name AS schema_name,t.name AS table_name,c.column_id,c.name AS column_name,ty.name AS data_type,c.max_length,c.precision,c.scale,c.is_nullable FROM sys.tables t JOIN sys.schemas s ON s.schema_id=t.schema_id JOIN sys.columns c ON c.object_id=t.object_id JOIN sys.types ty ON ty.user_type_id=c.user_type_id ORDER BY s.name,t.name,c.column_id;" -o /tmp/column_inventory.txt
          docker cp holoo-sql:/tmp/column_inventory.txt reports/column_inventory.txt
          "${SQLCMD[@]}" -Q "SELECT COUNT(*) AS user_tables FROM sys.tables; SELECT COUNT(*) AS views FROM sys.views; SELECT COUNT(*) AS stored_procedures FROM sys.procedures;" -o /tmp/object_counts.txt
          docker cp holoo-sql:/tmp/object_counts.txt reports/object_counts.txt
          echo 'Database restore and inventory completed.' > reports/RESTORE_SUCCESS.txt

      - name: Extract invoice, inventory, accounting relationships and business logic
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="$(cat /tmp/sql_sa_password)"
          SQLCMD=(docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d HolooAnalysis -W -s "|")
          "${SQLCMD[@]}" -Q "SELECT fk.name AS fk_name, OBJECT_SCHEMA_NAME(fk.parent_object_id) AS parent_schema, OBJECT_NAME(fk.parent_object_id) AS parent_table, pc.name AS parent_column, OBJECT_SCHEMA_NAME(fk.referenced_object_id) AS referenced_schema, OBJECT_NAME(fk.referenced_object_id) AS referenced_table, rc.name AS referenced_column FROM sys.foreign_keys fk JOIN sys.foreign_key_columns fkc ON fkc.constraint_object_id=fk.object_id JOIN sys.columns pc ON pc.object_id=fkc.parent_object_id AND pc.column_id=fkc.parent_column_id JOIN sys.columns rc ON rc.object_id=fkc.referenced_object_id AND rc.column_id=fkc.referenced_column_id ORDER BY parent_table,fk.name;" -o /tmp/foreign_keys.txt
          docker cp holoo-sql:/tmp/foreign_keys.txt reports/foreign_keys.txt
          "${SQLCMD[@]}" -Q "SELECT OBJECT_SCHEMA_NAME(k.parent_object_id) AS schema_name, OBJECT_NAME(k.parent_object_id) AS table_name, k.name AS constraint_name, k.type_desc, c.name AS column_name, ic.key_ordinal FROM sys.key_constraints k JOIN sys.index_columns ic ON ic.object_id=k.parent_object_id AND ic.index_id=k.unique_index_id JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id ORDER BY table_name,k.name,ic.key_ordinal;" -o /tmp/key_constraints.txt
          docker cp holoo-sql:/tmp/key_constraints.txt reports/key_constraints.txt
          "${SQLCMD[@]}" -Q "SELECT OBJECT_SCHEMA_NAME(i.object_id) AS schema_name, OBJECT_NAME(i.object_id) AS table_name, i.name AS index_name, i.is_primary_key, i.is_unique, i.type_desc, c.name AS column_name, ic.key_ordinal, ic.is_included_column FROM sys.indexes i JOIN sys.index_columns ic ON ic.object_id=i.object_id AND ic.index_id=i.index_id JOIN sys.columns c ON c.object_id=ic.object_id AND c.column_id=ic.column_id WHERE i.object_id IN (OBJECT_ID('dbo.FACTURE'),OBJECT_ID('dbo.FACTART'),OBJECT_ID('dbo.ARTICLE'),OBJECT_ID('dbo.SND_INDX'),OBJECT_ID('dbo.SANAD'),OBJECT_ID('dbo.SND_LIST'),OBJECT_ID('dbo.CUSTOMER'),OBJECT_ID('dbo.SARFASL'),OBJECT_ID('dbo.ArticlePrice')) ORDER BY table_name,index_name,ic.key_ordinal;" -o /tmp/core_indexes.txt
          docker cp holoo-sql:/tmp/core_indexes.txt reports/core_indexes.txt
          "${SQLCMD[@]}" -Q "SELECT Fac_Type, COUNT(*) AS invoice_count, MIN(Fac_Date) AS first_date, MAX(Fac_Date) AS last_date, SUM(CASE WHEN ISNULL([Delete],0)=1 THEN 1 ELSE 0 END) AS deleted_count, SUM(CASE WHEN Sanad_Code IS NOT NULL AND Sanad_Code<>0 THEN 1 ELSE 0 END) AS linked_sanad_count FROM dbo.FACTURE GROUP BY Fac_Type ORDER BY Fac_Type;" -o /tmp/invoice_type_summary.txt
          docker cp holoo-sql:/tmp/invoice_type_summary.txt reports/invoice_type_summary.txt
          "${SQLCMD[@]}" -Q "SELECT TOP 100 Fac_Code,Fac_Type,Fac_Code_C,Fac_Date,Sum_Price,Sum_Few,FNaghd,FCheck,FNesieh,Takhfif,Sanad_Code,[Delete],Fac_State FROM dbo.FACTURE ORDER BY Fac_Date DESC,Fac_Code DESC;" -o /tmp/invoice_header_samples.txt
          docker cp holoo-sql:/tmp/invoice_header_samples.txt reports/invoice_header_samples.txt
          "${SQLCMD[@]}" -Q "SELECT TOP 250 Fac_Code,Fac_Type,A_Code,A_Index,Few_Article,Few_Article2,Price_BS,Buy_Price,EndBuy_Price,EndBuy_PriceK,Sel_Price,DarsadTakhfif,TakhfifSatriR,VahedCode,VahedFew,ArtExist FROM dbo.FACTART ORDER BY Fac_Code DESC,A_Index;" -o /tmp/invoice_line_samples.txt
          docker cp holoo-sql:/tmp/invoice_line_samples.txt reports/invoice_line_samples.txt
          "${SQLCMD[@]}" -Q "SELECT COUNT(*) AS total_lines, COUNT(DISTINCT fa.Fac_Code) AS distinct_invoice_codes, COUNT(DISTINCT fa.Fac_Type) AS distinct_invoice_types, SUM(CASE WHEN a.A_Code IS NULL THEN 1 ELSE 0 END) AS lines_without_article FROM dbo.FACTART fa LEFT JOIN dbo.ARTICLE a ON a.A_Code=fa.A_Code; SELECT COUNT(*) AS header_count, SUM(CASE WHEN x.Fac_Code IS NOT NULL THEN 1 ELSE 0 END) AS headers_with_matching_lines FROM dbo.FACTURE f LEFT JOIN (SELECT Fac_Code,Fac_Type FROM dbo.FACTART GROUP BY Fac_Code,Fac_Type) x ON x.Fac_Code=f.Fac_Code AND x.Fac_Type=f.Fac_Type;" -o /tmp/invoice_link_checks.txt
          docker cp holoo-sql:/tmp/invoice_link_checks.txt reports/invoice_link_checks.txt
          SQLCMD_MODULE=(docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -d HolooAnalysis -s "|")
          "${SQLCMD_MODULE[@]}" -y 0 -Y 0 -Q "SELECT o.type_desc, OBJECT_SCHEMA_NAME(o.object_id) AS schema_name, o.name, m.definition FROM sys.objects o JOIN sys.sql_modules m ON m.object_id=o.object_id WHERE o.name IN ('InsertInFacture','InsertInFactureCode','CreateUpdateAvgPrice','CheckGeymatTamamShodeh2','ReturnFewForFacture','sp_ReturnArtExistWithKardex','sp_ReturnArtExistWithKardex1','CreateTempArticleKardex','Calc_Mandeh_CustomerFuncDate','Sp_Calc_bedbes_MandehCust','ShowSanads','W_ArtKardexForCalcPrice','W_ArtKardexWithoutAmani','W_ArtKardexWithAmani','W_ShowArticleForSearch_Big','FactureU','SanadU') ORDER BY o.type_desc,o.name;" -o /tmp/core_business_logic.txt
          docker cp holoo-sql:/tmp/core_business_logic.txt reports/core_business_logic.txt
          "${SQLCMD[@]}" -Q "SELECT fa.Fac_Type,COUNT(*) AS line_count,COUNT(DISTINCT fa.Fac_Code) AS invoice_code_count,SUM(CASE WHEN f.Fac_Code IS NULL THEN 1 ELSE 0 END) AS lines_without_header FROM dbo.FACTART fa LEFT JOIN dbo.FACTURE f ON f.Fac_Code=fa.Fac_Code AND f.Fac_Type=fa.Fac_Type GROUP BY fa.Fac_Type ORDER BY fa.Fac_Type;" -o /tmp/factart_type_summary.txt
          docker cp holoo-sql:/tmp/factart_type_summary.txt reports/factart_type_summary.txt
          "${SQLCMD[@]}" -Q "SELECT f.Fac_Code,f.Fac_Type,f.Sum_Price,x.LineSum,ISNULL(f.Sum_Price,0)-ISNULL(x.LineSum,0) AS Delta,x.LineCount,x.SumQty,f.Sum_Few FROM dbo.FACTURE f LEFT JOIN (SELECT Fac_Code,Fac_Type,SUM(ISNULL(Few_Article,0)*ISNULL(Price_BS,0)) AS LineSum,COUNT(*) AS LineCount,SUM(ISNULL(Few_Article,0)) AS SumQty FROM dbo.FACTART GROUP BY Fac_Code,Fac_Type) x ON x.Fac_Code=f.Fac_Code AND x.Fac_Type=f.Fac_Type ORDER BY f.Fac_Type,f.Fac_Date,f.Fac_Code;" -o /tmp/invoice_total_reconciliation.txt
          docker cp holoo-sql:/tmp/invoice_total_reconciliation.txt reports/invoice_total_reconciliation.txt
          "${SQLCMD[@]}" -Q "SELECT Name,[Integer],[Double],[String] FROM dbo.MSETUP2 WHERE Name IN ('RoundNumber','RoundPrice','RoundFact','PriceRound') ORDER BY Name;" -o /tmp/rounding_settings.txt
          docker cp holoo-sql:/tmp/rounding_settings.txt reports/rounding_settings.txt
          "${SQLCMD[@]}" -Q "WITH movement AS (SELECT A_Code,SUM(InQty) AS InQty,SUM(OutQty) AS OutQty FROM (SELECT A_Code,SUM(ISNULL(Few_Article,0)) AS InQty,CAST(0 AS float) AS OutQty FROM dbo.FACTART WHERE Fac_Type IN ('K','Y','D') GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few_Article,0)) FROM dbo.FACTART WHERE Fac_Type IN ('F','X','Z','S') GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few,0)),CAST(0 AS float) FROM dbo.FAC_BILD WHERE A_Type='T' GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few,0)) FROM dbo.FAC_BILD WHERE A_Type='M' GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(First_Article,0)) FROM dbo.ABAILPRE WHERE Fac_Type='A' GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(First_Exist,0)),CAST(0 AS float) FROM dbo.AB_CATCH GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few1,0)),CAST(0 AS float) FROM dbo.Art_Bail WHERE BailType IN ('f','o','y') AND Few1>0 GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few1,0)) FROM dbo.Art_Bail WHERE BailType IN ('k','i','x') AND Few1>0 GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(VCF_Count,0)) FROM dbo.VC_Facture GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(VCF_RCount,0)),CAST(0 AS float) FROM dbo.VC_Facture GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few,0)),CAST(0 AS float) FROM dbo.GoldAcountArt WHERE Fac_Type IN ('K','Y','D') GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few,0)) FROM dbo.GoldAcountArt WHERE Fac_Type IN ('F','X','Z','S') GROUP BY A_Code) q GROUP BY A_Code) SELECT COUNT(*) AS article_count, SUM(CASE WHEN ABS(ROUND(ISNULL(a.First_Exist,0)+ISNULL(m.InQty,0)-ISNULL(m.OutQty,0),5)-ISNULL(a.Exist,0))<0.00001 THEN 1 ELSE 0 END) AS exact_stock_matches, SUM(CASE WHEN ABS(ROUND(ISNULL(a.First_Exist,0)+ISNULL(m.InQty,0)-ISNULL(m.OutQty,0),5)-ISNULL(a.Exist,0))>=0.00001 THEN 1 ELSE 0 END) AS stock_mismatches FROM dbo.ARTICLE a LEFT JOIN movement m ON m.A_Code=a.A_Code;" -o /tmp/stock_reconciliation.txt
          docker cp holoo-sql:/tmp/stock_reconciliation.txt reports/stock_reconciliation.txt
          "${SQLCMD_MODULE[@]}" -y 0 -Y 0 -Q "SELECT o.type_desc,OBJECT_SCHEMA_NAME(o.object_id) AS schema_name,o.name,m.definition FROM sys.objects o JOIN sys.sql_modules m ON m.object_id=o.object_id WHERE o.name='ReturnTypeForKardex' ORDER BY o.name;" -o /tmp/return_type_for_kardex.txt
          docker cp holoo-sql:/tmp/return_type_for_kardex.txt reports/return_type_for_kardex.txt
          "${SQLCMD[@]}" -Q "SELECT fa.Fac_Code,fa.Fac_Type,fa.A_Code,fa.A_Index,fa.Few_Article,fa.Price_BS,fa.Buy_Price,fa.EndBuy_Price,fa.EndBuy_PriceK FROM dbo.FACTART fa LEFT JOIN dbo.FACTURE f ON f.Fac_Code=fa.Fac_Code AND f.Fac_Type=fa.Fac_Type WHERE f.Fac_Code IS NULL;" -o /tmp/orphan_invoice_lines.txt
          docker cp holoo-sql:/tmp/orphan_invoice_lines.txt reports/orphan_invoice_lines.txt
          "${SQLCMD[@]}" -Q "SELECT f.Fac_Code,f.Fac_Type,f.Sum_Price,x.LineSum,x.RoundedLineSum,ISNULL(f.Sum_Price,0)-ISNULL(x.LineSum,0) AS RawDelta,ISNULL(f.Sum_Price,0)-ISNULL(x.RoundedLineSum,0) AS RoundedDelta,x.LineCount,x.SumQty,f.Sum_Few FROM dbo.FACTURE f LEFT JOIN (SELECT Fac_Code,Fac_Type,SUM(ISNULL(Few_Article,0)*ISNULL(Price_BS,0)) AS LineSum,SUM(ROUND(ISNULL(Few_Article,0)*ISNULL(Price_BS,0),0)) AS RoundedLineSum,COUNT(*) AS LineCount,SUM(ISNULL(Few_Article,0)) AS SumQty FROM dbo.FACTART GROUP BY Fac_Code,Fac_Type) x ON x.Fac_Code=f.Fac_Code AND x.Fac_Type=f.Fac_Type ORDER BY f.Fac_Type,f.Fac_Date,f.Fac_Code;" -o /tmp/invoice_total_reconciliation_rounding.txt
          docker cp holoo-sql:/tmp/invoice_total_reconciliation_rounding.txt reports/invoice_total_reconciliation_rounding.txt
          "${SQLCMD[@]}" -Q "WITH movement AS (SELECT A_Code,SUM(InQty) AS InQty,SUM(OutQty) AS OutQty FROM (SELECT A_Code,SUM(ISNULL(Few_Article,0)) AS InQty,CAST(0 AS float) AS OutQty FROM dbo.FACTART WHERE Fac_Type IN ('K','Y','D') GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few_Article,0)) FROM dbo.FACTART WHERE Fac_Type IN ('F','X','Z','S') GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few,0)),CAST(0 AS float) FROM dbo.FAC_BILD WHERE A_Type='T' GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few,0)) FROM dbo.FAC_BILD WHERE A_Type='M' GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(First_Article,0)) FROM dbo.ABAILPRE WHERE Fac_Type='A' GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(First_Exist,0)),CAST(0 AS float) FROM dbo.AB_CATCH GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few1,0)),CAST(0 AS float) FROM dbo.Art_Bail WHERE BailType IN ('f','o','y') AND Few1>0 GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few1,0)) FROM dbo.Art_Bail WHERE BailType IN ('k','i','x') AND Few1>0 GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(VCF_Count,0)) FROM dbo.VC_Facture GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(VCF_RCount,0)),CAST(0 AS float) FROM dbo.VC_Facture GROUP BY A_Code UNION ALL SELECT A_Code,SUM(ISNULL(Few,0)),CAST(0 AS float) FROM dbo.GoldAcountArt WHERE Fac_Type IN ('K','Y','D') GROUP BY A_Code UNION ALL SELECT A_Code,CAST(0 AS float),SUM(ISNULL(Few,0)) FROM dbo.GoldAcountArt WHERE Fac_Type IN ('F','X','Z','S') GROUP BY A_Code) q GROUP BY A_Code) SELECT TOP 50 a.A_Code,a.First_Exist,a.Exist,ISNULL(m.InQty,0) AS InQty,ISNULL(m.OutQty,0) AS OutQty,ROUND(ISNULL(a.First_Exist,0)+ISNULL(m.InQty,0)-ISNULL(m.OutQty,0),5) AS CalculatedExist,ROUND(ISNULL(a.First_Exist,0)+ISNULL(m.InQty,0)-ISNULL(m.OutQty,0),5)-ISNULL(a.Exist,0) AS Delta FROM dbo.ARTICLE a LEFT JOIN movement m ON m.A_Code=a.A_Code WHERE ABS(ROUND(ISNULL(a.First_Exist,0)+ISNULL(m.InQty,0)-ISNULL(m.OutQty,0),5)-ISNULL(a.Exist,0))>=0.00001 ORDER BY a.A_Code;" -o /tmp/stock_mismatch_details.txt
          docker cp holoo-sql:/tmp/stock_mismatch_details.txt reports/stock_mismatch_details.txt
          "${SQLCMD[@]}" -Q "SELECT a.A_Code,a.A_Code_C,a.A_Name,a.First_Exist,a.Exist,a.First_Exist2,a.Exist2,a.Exist_Mandeh,a.Buy_Price,a.EndBuy_Price,a.Delete,a.Type_Anbar_C,a.Creation_Date,a.Finish_Date FROM dbo.ARTICLE a WHERE a.A_Code='0101001';" -o /tmp/stock_mismatch_article_detail.txt
          docker cp holoo-sql:/tmp/stock_mismatch_article_detail.txt reports/stock_mismatch_article_detail.txt
          "${SQLCMD[@]}" -Q "SELECT COUNT(*) AS facture_rows, SUM(CASE WHEN s.Sanad_Code IS NOT NULL THEN 1 ELSE 0 END) AS facture_sanad_found, SUM(CASE WHEN s.Sanad_Code IS NULL THEN 1 ELSE 0 END) AS facture_sanad_missing FROM dbo.FACTURE f LEFT JOIN dbo.SANAD s ON s.Sanad_Code=f.Sanad_Code; SELECT COUNT(*) AS snd_indx_rows, SUM(CASE WHEN f.Fac_Code IS NOT NULL THEN 1 ELSE 0 END) AS snd_indx_invoice_found, SUM(CASE WHEN f.Fac_Code IS NULL THEN 1 ELSE 0 END) AS snd_indx_invoice_missing, SUM(CASE WHEN s.Sanad_Code IS NOT NULL THEN 1 ELSE 0 END) AS snd_indx_sanad_found, SUM(CASE WHEN s.Sanad_Code IS NULL THEN 1 ELSE 0 END) AS snd_indx_sanad_missing FROM dbo.SND_INDX x LEFT JOIN dbo.FACTURE f ON f.Fac_Code=x.Fac_Code AND f.Fac_Type=x.Fac_Type LEFT JOIN dbo.SANAD s ON s.Sanad_Code=x.Sanad_Code; SELECT COUNT(*) AS snd_list_rows, SUM(CASE WHEN s.Sanad_Code IS NOT NULL THEN 1 ELSE 0 END) AS snd_list_sanad_found, SUM(CASE WHEN s.Sanad_Code IS NULL THEN 1 ELSE 0 END) AS snd_list_sanad_missing FROM dbo.SND_LIST l LEFT JOIN dbo.SANAD s ON s.Sanad_Code=l.Sanad_Code;" -o /tmp/accounting_link_validation.txt
          docker cp holoo-sql:/tmp/accounting_link_validation.txt reports/accounting_link_validation.txt
          "${SQLCMD[@]}" -Q "SELECT TOP 50 f.Fac_Code,f.Fac_Type,f.Sanad_Code,x.Sanad_Code AS Index_Sanad_Code,CASE WHEN f.Sanad_Code=x.Sanad_Code THEN 1 ELSE 0 END AS same_sanad FROM dbo.FACTURE f LEFT JOIN dbo.SND_INDX x ON x.Fac_Code=f.Fac_Code AND x.Fac_Type=f.Fac_Type ORDER BY f.Fac_Type,f.Fac_Code;" -o /tmp/accounting_link_samples.txt
          docker cp holoo-sql:/tmp/accounting_link_samples.txt reports/accounting_link_samples.txt
          echo 'Core relational and business-logic extraction completed.' > reports/CORE_EXTRACTION_SUCCESS.txt

      - name: Upload restored database reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holoo-restored-database-inventory
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy isolated SQL Server
        if: always()
        shell: bash
        run: docker rm -f holoo-sql || true
