name: Holoo SQL Backup Metadata

on:
  workflow_dispatch:
  push:
    paths:
      - 'AutoHoloo1_030223_11-08-27_S700963.Zip'
      - '.github/workflows/holoo-sql-metadata.yml'

permissions:
  contents: read

jobs:
  read-sql-backup-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Extract backup payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('AutoHoloo1_030223_11-08-27_S700963.Zip')
          entries=[e for e in z.infolist() if not e.is_dir()]
          if len(entries)!=1:
              raise SystemExit(f'Expected one payload, found {len(entries)}')
          with z.open(entries[0]) as src, open('/tmp/holoo_backup.bak','wb') as dst:
              while True:
                  b=src.read(1024*1024)
                  if not b: break
                  dst.write(b)
          PY
          mkdir -p reports
          sha256sum /tmp/holoo_backup.bak | tee reports/backup_sha256.txt
          ls -lh /tmp/holoo_backup.bak | tee reports/backup_file_size.txt

      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="Knd$(openssl rand -hex 18)aA9!"
          echo "$SA_PASSWORD" > /tmp/sql_sa_password
          docker pull mcr.microsoft.com/mssql/server:2022-latest
          docker run -d --name holoo-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$SA_PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            if docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              exit 0
            fi
            sleep 5
          done
          docker logs holoo-sql
          exit 1

      - name: Read backup header and logical file list only
        shell: bash
        run: |
          set -euo pipefail
          SA_PASSWORD="$(cat /tmp/sql_sa_password)"
          # The SQL Server image does not guarantee that its backup directory exists.
          docker exec -u 0 holoo-sql mkdir -p /var/opt/mssql/backup
          docker cp /tmp/holoo_backup.bak holoo-sql:/var/opt/mssql/backup/holoo_backup.bak
          docker exec -u 0 holoo-sql chown mssql:mssql /var/opt/mssql/backup/holoo_backup.bak
          docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -W -s "|" -Q "RESTORE HEADERONLY FROM DISK = N'/var/opt/mssql/backup/holoo_backup.bak';" -o /tmp/header.txt
          docker cp holoo-sql:/tmp/header.txt reports/restore_header.txt
          docker exec holoo-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b -W -s "|" -Q "RESTORE FILELISTONLY FROM DISK = N'/var/opt/mssql/backup/holoo_backup.bak';" -o /tmp/filelist.txt
          docker cp holoo-sql:/tmp/filelist.txt reports/restore_filelist.txt
          cat reports/restore_header.txt
          cat reports/restore_filelist.txt

      - name: Upload SQL backup metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holoo-sql-backup-metadata
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated SQL Server
        if: always()
        shell: bash
        run: docker rm -f holoo-sql || true
